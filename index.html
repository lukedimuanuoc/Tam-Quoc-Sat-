n" data-i="39" onclick="toggleGeneral(this)">Đinh Phụng</button><button type="button" class="general-btn" data-i="40" onclick="toggleGeneral(this)">Tôn Sách</button><button type="button" class="general-btn" data-i="41" onclick="toggleGeneral(this)">Tôn Kiên</button><button type="button" class="general-btn" data-i="42" onclick="toggleGeneral(this)">Trình Phổ</button><button type="button" class="general-btn" data-i="43" onclick="toggleGeneral(this)">Chu Thái</button><button type="button" class="general-btn" data-i="44" onclick="toggleGeneral(this)">Từ Thịnh</button><button type="button" class="general-btn" data-i="45" onclick="toggleGeneral(this)">Lữ Bố</button><button type="button" class="general-btn" data-i="46" onclick="toggleGeneral(this)">Điêu Thuyền</button><button type="button" class="general-btn" data-i="47" onclick="toggleGeneral(this)">Hoa Đà</button><button type="button" class="general-btn" data-i="48" onclick="toggleGeneral(this)">Trương Giác</button><button type="button" class="general-btn" data-i="49" onclick="toggleGeneral(this)">Viên Thiệu</button><button type="button" class="general-btn" data-i="50" onclick="toggleGeneral(this)">Đổng Trác</button><button type="button" class="general-btn" data-i="51" onclick="toggleGeneral(this)">Giả Hủ</button><button type="button" class="general-btn" data-i="52" onclick="toggleGeneral(this)">Thái Văn Cơ</button><button type="button" class="general-btn" data-i="53" onclick="toggleGeneral(this)">Trần Cung</button><button type="button" class="general-btn" data-i="54" onclick="toggleGeneral(this)">Kỷ Linh</button><button type="button" class="general-btn" data-i="55" onclick="toggleGeneral(this)">Cao Lãm</button><button type="button" class="general-btn" data-i="56" onclick="toggleGeneral(this)">Trương Tú</button><button type="button" class="general-btn" data-i="57" onclick="toggleGeneral(this)">Mã Đằng</button><button type="button" class="general-btn" data-i="58" onclick="toggleGeneral(this)">Khổng Dung</button><button ty <script>
const generals=[["Tào Tháo","Ngụy",4,"Thu Nạp: sau khi chịu sát thương, rút 1 lá."],["Tư Mã Ý","Ngụy",3,"Quỷ Tài: 25% cơ hội né Trick."],["Hạ Hầu Đôn","Ngụy",4,"Cương Liệt: bị Slash có 30% phản 1 sát thương."],["Hạ Hầu Uyên","Ngụy",4,"Thần Tốc: lượt đầu rút thêm 1."],["Trương Liêu","Ngụy",4,"Cứu Tốc: đầu lượt có 30% rút thêm 1."],["Điển Vi","Ngụy",4,"Ác Lai: Slash đầu tiên mỗi lượt +1 sát thương."],["Hứa Chử","Ngụy",4,"Cuồng Chiến: khi HP ≤2, Slash +1."],["Quách Gia","Ngụy",3,"Di Ngôn: khi chết, đồng đội rút 2."],["Tuân Úc","Ngụy",3,"Trí Mưu: Peach hồi thêm 1."],["Trương Cáp","Ngụy",4,"巧变: mỗi lượt một lần đổi 1 lá."],["Tào Nhân","Ngụy",4,"Thủ Thành: lượt đầu mỗi vòng giảm 1 sát thương."],["Tào Phi","Ngụy",3,"Hành Phạt: hạ đối thủ được rút 2."],["Bàng Đức","Ngụy",4,"Mã Đao: Slash có 20% gây thêm 1."],["Cao Thuận","Ngụy",4,"Hãm Trận: Duel gây thêm 1."],["Trình Dục","Ngụy",3,"Cố Thủ: lần đầu mỗi lượt bị Trick, giảm 1."],["Lưu Bị","Thục",4,"Nhân Đức: Peach hồi thêm 1."],["Quan Vũ","Thục",4,"Võ Thánh: một lá đỏ có thể dùng như Slash."],["Trương Phi","Thục",4,"Hào Sảng: được dùng 2 Slash/lượt."],["Triệu Vân","Thục",4,"Long Đảm: Dodge có thể dùng như Slash và ngược lại."],["Gia Cát Lượng","Thục",3,"Quan Tinh: đầu lượt xem 2 lá trên deck."],["Hoàng Nguyệt Anh","Thục",3,"Cơ Trí: dùng Trick rút 1."],["Mã Siêu","Thục",4,"Thiết Kỵ: Slash có 30% bỏ qua Dodge."],["Hoàng Trung","Thục",4,"Lão Đương Ích Tráng: Slash tầm xa."],["Ngụy Diên","Thục",4,"Cuồng Cốt: gây sát thương hồi 1 nếu đang bị thương."],["Khương Duy","Thục",4,"Thừa Chí: mỗi lượt đầu tiên dùng Trick rút 1."],["Bàng Thống","Thục",3,"Liên Hoàn: Fire Attack thêm 1 sát thương."],["Pháp Chính","Thục",3,"Mưu Đoạn: khi bị đánh rút 1."],["Ngụy Nghiên","Thục",4,"Tập Kích: đầu lượt có thể bỏ 1 lá để gây 1."],["Lỗ Túc","Thục",3,"Hào Phóng: khi ít bài hơn mục tiêu, rút 1."],["Giản Ung","Thục",3,"Thuyết Khách: Trick có 20% không bị bỏ."],["Tôn Quyền","Ngô",4,"Chế Hành: đầu lượt 25% rút thêm 1."],["Cam Ninh","Ngô",4,"Tập Kích: Steal gây thêm 1."],["Lữ Mông","Ngô",4,"Kết Tập: khi dùng Slash có 20% rút 1."],["Hoàng Cái","Ngô",4,"Khổ Nhục: bỏ 1 lá để hồi 2."],["Chu Du","Ngô",3,"Anh Tư: Fire Attack +1."],["Đại Kiều","Ngô",3,"Khuynh Quốc: Dodge thành công hồi 1."],["Tiểu Kiều","Ngô",3,"Thiên Hương: bị Slash có 25% chuyển 1 sát thương thành hồi."],["Thái Sử Từ","Ngô",4,"Thiên Nghĩa: có thể dùng 2 Slash/lượt."],["Lục Tốn","Ngô",3,"Liên Doanh: khi bị Fire Attack, giảm 1."],["Đinh Phụng","Ngô",4,"Đoạn Cung: Slash +1 khi mục tiêu đầy HP."],["Tôn Sách","Ngô",4,"Kiêu Quả: sau khi gây sát thương rút 1."],["Tôn Kiên","Ngô",4,"Anh Hồn: khi HP thấp rút 2."],["Trình Phổ","Ngô",4,"Dục Hỏa: Fire Attack không bị Dodge."],["Chu Thái","Ngô",4,"Bất Khuất: lần đầu chết giữ 1 HP."],["Từ Thịnh","Ngô",4,"Phá Thành: Slash có 20% thêm 1."],["Lữ Bố","Quần",5,"Vô Song: Slash gây 2."],["Điêu Thuyền","Quần",3,"Ly Gián: Duel gây thêm 1."],["Hoa Đà","Quần",3,"Thanh Nang: Peach hồi thêm 1."],["Trương Giác","Quần",3,"Lôi Kích: Fire Attack có 30% gây thêm 1."],["Viên Thiệu","Quần",4,"Loạn Kích: đầu lượt nếu có 5+ bài, gây 1 cho mục tiêu."],["Đổng Trác","Quần",5,"Bạo Ngược: HP tối đa 5, Peach hồi +1."],["Giả Hủ","Quần",3,"Lâu Thế: Trick có 30% không bị Negate."],["Thái Văn Cơ","Quần",3,"Bi Thương: khi đồng đội chết, rút 2."],["Trần Cung","Quần",3,"Minh Sách: dùng Trick rút 1."],["Kỷ Linh","Quần",4,"Tam Tiêm: Slash có 25% gây thêm 1."],["Cao Lãm","Quần",4,"Hổ Uy: khi HP đầy, Slash +1."],["Trương Tú","Quần",4,"Cái Thế: lượt đầu được thêm 1 Slash."],["Mã Đằng","Quần",4,"Mã Thuật: không bị phạt khoảng cách."],["Khổng Dung","Quần",3,"Nghĩa Khí: Peach hồi thêm 1 cho người khác."],["Đào Khiêm","Quần",3,"Khiêm Nhượng: nhận sát thương có 25% giảm 1."]];
const cardCounts={"Slash":21,"Fire Slash":3,"Thunder Slash":5,"Dodge":14,"Peach":8,"Wine":3,"Dismantlement":3,"Snatch":3,"Duel":2,"Collateral":1,"Ex Nihilo":2,"Nullification":1,"Iron Chain":3,"Fire Attack":2,"Archery Attack":1,"Savage Assault":2,"Alliance Feast":1,"Harvest":1,"National Nullification":2,"Await Exhausted":2,"Known Both":2,"Distant Alliance":1,"Lightning":1,"Indulgence":2,"Supply Shortage":2,"Weapon":10,"Armor":5,"Horse +1":3,"Horse -1":2};
let S=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function log(s){let d=document.createElement('div');d.textContent=s;$('log').appendChild(d);$('log').scrollTop=$('log').scrollHeight}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function deck(){let a=[];for(const [n,c] of Object.entries(cardCounts))for(let i=0;i<c;i++)a.push(n);return shuffle(a)}
function gobj(x){return {name:x[0],f:x[1],max:x[2],hp:x[2],skill:x[3],shown:false}}
function fill(){
  const box=$('generalPick'); box.innerHTML='';
  const factions=['Ngụy','Thục','Ngô','Quần'];
  factions.forEach(f=>{
    const sec=document.createElement('div'); sec.style.marginBottom='10px';
    sec.innerHTML='<b style="display:block;margin-bottom:5px">'+f+'</b>';
    generals.forEach((g,i)=>{
      if(g[1]!==f)return;
      const b=document.createElement('button'); b.type='button'; b.dataset.i=i;
      b.textContent=g[0]+' · '+g[2]+' HP'; b.style.margin='3px';
      b.onclick=()=>pickGeneral(i,b); sec.appendChild(b);
    });
    box.appendChild(sec);
  });
  S=null;
}
function pickGeneral(i,b){
  if(b.classList.contains('picked')){b.classList.remove('picked');b.style.outline='';}
  else {
    const picked=[...$('generalPick').querySelectorAll('.picked')];
    if(picked.length>=2){log('Bạn chỉ được chọn 2 tướng.');return;}
    b.classList.add('picked'); b.style.outline='2px solid #d1a75a';
  }
  $('pickCount').textContent='Đã chọn: '+$('generalPick').querySelectorAll('.picked').length+'/2';
}
function start(){let picks=[...$('generalPick').querySelectorAll('.picked')].map(b=>+b.dataset.i);if(picks.length!==2){alert('Hãy chọn đủ 2 tướng.');return}let a=gobj(generals[picks[0]]),b=gobj(generals[picks[1]]);if(a.name===b.name){alert('Hai tướng phải khác nhau.');return}let used=new Set([a.name,b.name]);let others=[];while(others.length<6){let x=generals[Math.floor(Math.random()*generals.length)];if(!used.has(x[0])){used.add(x[0]);others.push(x)}}S={players:[{id:0,ai:false,gs:[a,b],hand:[],hp:a.max+1,max:a.max+1,alive:true,shown:false,usedSlash:0,dodge:false,target:null},{id:1,ai:true,gs:[gobj(others[0]),gobj(others[1])],hand:[],hp:others[0][2]+1,max:others[0][2]+1,alive:true,shown:false,usedSlash:0,dodge:false},{id:2,ai:true,gs:[gobj(others[2]),gobj(others[3])],hand:[],hp:others[2][2]+1,max:others[2][2]+1,alive:true,shown:false,dodge:false},{id:3,ai:true,gs:[gobj(others[4]),gobj(others[5])],hand:[],hp:others[4][2]+1,max:others[4][2]+1,alive:true,shown:false,dodge:false}],deck:deck(),discard:[],turn:0,target:null,phase:'play',winner:null};$('setup').hidden=true;$('game').hidden=false;for(const p of S.players)draw(p,4);log('Quốc Chiến bắt đầu. Tất cả tướng đều đang ám.');begin();render()}
function draw(p,n=1){for(let i=0;i<n;i++){if(!S.deck.length){S.deck=shuffle(S.discard);S.discard=[]}if(S.deck.length)p.hand.push(S.deck.pop())}}
function faction(p){return p.shown?p.gs[0].f:null}
function reveal(p,idx=0){if(!p.shown){p.shown=true;p.gs[idx].shown=true;log('Người chơi '+(p.id+1)+' minh trí '+p.gs[idx].name+' — '+p.gs[idx].f+'.');}}
function current(){return S.players[S.turn]}
function enemiesOf(p){return S.players.filter(x=>x.alive&&x.id!==p.id&&(!faction(p)||!faction(x)||faction(p)!==faction(x)))}
function targetable(p){return enemiesOf(p)}
function damage(src,t,dmg){if(!t.alive)return;if(t.dodge){t.dodge=false;log('Người chơi '+(t.id+1)+' dùng Dodge — né thành công.');return}t.hp-=dmg;log('Người chơi '+(src.id+1)+' gây '+dmg+' sát thương cho người chơi '+(t.id+1)+'.');if(t.gs[0].name==='Hạ Hầu Đôn'&&Math.random()<.3){src.hp=Math.max(0,src.hp-1);log('Cương Liệt phản 1 sát thương.')}if(t.hp<=0){t.alive=false;log('☠ Người chơi '+(t.id+1)+' bị loại.');if(t.gs[0].name==='Quách Gia')for(const x of S.players.filter(x=>x.alive&&x.id!==t.id))draw(x,2)}}
function useCard(p,i){if(!p.alive||p!==current())return;let c=p.hand[i];if(!c)return;let target=S.target!=null?S.players[S.target]:null;if(['Slash','Fire Slash','Thunder Slash','Dismantlement','Snatch','Duel','Fire Attack'].includes(c)&&(!target||!target.alive)){log('Hãy chọn mục tiêu trước.');return}if(c==='Slash'||c==='Fire Slash'||c==='Thunder Slash'){reveal(p,0);let dmg=c==='Slash'?1:2;if(p.gs[0].name==='Lữ Bố')dmg=2;if(p.gs[0].name==='Điển Vi'&&p.usedSlash===0)dmg++;if(p.gs[0].name==='Hứa Chử'&&p.hp<=2)dmg++;if(p.gs[0].name==='Chu Du'&&c==='Fire Slash')dmg++;damage(p,target,dmg);p.usedSlash++}else if(c==='Dodge'){p.dodge=true;log('Người chơi '+(p.id+1)+' giữ Dodge.')}else if(c==='Peach'){p.hp=Math.min(p.max,p.hp+((p.gs[0].name==='Lưu Bị'||p.gs[0].name==='华佗'||p.gs[0].name==='Hoa Đà')?2:1));log('Người chơi '+(p.id+1)+' hồi máu.')}else if(c==='Wine'){p.wine=true;log('Người chơi '+(p.id+1)+' dùng Wine.')}else if(c==='Dismantlement'||c==='Snatch'){reveal(p,0);if(target.hand.length){let k=Math.floor(Math.random()*target.hand.length);S.discard.push(target.hand.splice(k,1)[0])}if(c==='Snatch')draw(p,1);log(c+' lên người chơi '+(target.id+1)+'.')}else if(c==='Duel'){reveal(p,0);damage(p,target,p.gs[0].name==='Điêu Thuyền'?3:2)}else if(c==='Fire Attack'){reveal(p,0);damage(p,target,p.gs[0].name==='Chu Du'||p.gs[0].name==='Bàng Thống'?2:1)}else if(c==='Ex Nihilo'){draw(p,2);log('Ex Nihilo: rút 2.')}else if(c==='Harvest'){for(const x of S.players.filter(x=>x.alive))draw(x,1);log('Harvest: mọi người rút 1.')}else if(c==='Alliance Feast'){for(const x of S.players.filter(x=>x.alive))x.hp=Math.min(x.max,x.hp+1);log('Alliance Feast: mọi người hồi 1.')}else if(c==='Savage Assault'||c==='Archery Attack'){for(const x of targetable(p)){if(x.dodge)x.dodge=false;else x.hp--;log(c+' gây 1 sát thương cho người chơi '+(x.id+1)+'.');if(x.hp<=0)x.alive=false}}else if(c==='Nullification'||c==='National Nullification'){log('Nullification được giữ lại để phản ứng ở bản V1 đầy đủ.')}else if(c==='Weapon'||c==='Armor'||c==='Horse +1'||c==='Horse -1'){p.equip=c;log('Người chơi '+(p.id+1)+' trang bị '+c+'.')}else if(['Indulgence','Supply Shortage','Lightning','Iron Chain','Collateral','Await Exhausted','Known Both','Distant Alliance'].includes(c)){log(c+' được đặt lên mục tiêu, hiệu ứng đầy đủ sẽ bổ sung trong V1.')}else{log(c+' được dùng.')}p.hand.splice(i,1);S.discard.push(c);S.target=null;check();render()}
function aiTurn(p){if(!p.alive)return next();reveal(p,Math.random()<.5?0:1);draw(p,2);let enemies=targetable(p);let target=enemies[0];if(!target)return check();let heal=p.hand.findIndex(c=>c==='Peach');if(p.hp<=2&&heal>=0){useAI(p,heal);return}let atk=p.hand.findIndex(c=>['Slash','Fire Slash','Thunder Slash','Duel','Fire Attack'].includes(c));if(atk>=0){S.target=target.id;useAI(p,atk);return}let steal=p.hand.findIndex(c=>c==='Snatch');if(steal>=0){S.target=target.id;useAI(p,steal);return}next()}
function useAI(p,i){let old=S.turn;S.turn=p.id;useCard(p,i);if(S.winner==null&&S.players[p.id].alive)next()}
function next(){let tries=0;do{S.turn=(S.turn+1)%4;tries++}while(!S.players[S.turn].alive&&tries<5);S.players.forEach(p=>p.usedSlash=0);if(!S.winner){if(S.turn===0){draw(S.players[0],2);log('Đến lượt bạn.');}else setTimeout(()=>aiTurn(current()),350)}render()}
function check(){let alive=S.players.filter(p=>p.alive);let human=S.players[0];if(!human.alive)S.winner='AI';else if(alive.length===1)S.winner=human.alive?'Bạn':'AI';if(S.winner){log(S.winner==='Bạn'?'🏆 Bạn là người sống sót cuối cùng!':'💀 Bạn đã bị loại.');}}
function render(){if(!S)return;$('status').innerHTML='<b>Lượt '+(S.turn+1)+'</b> · '+(S.deck.length)+' lá trong deck · '+(S.winner?'Kết quả: '+S.winner:'Bạn chọn mục tiêu rồi dùng bài');let box=$('seats');box.innerHTML='';S.players.forEach(p=>{let d=document.createElement('div');d.className='seat'+(!p.alive?' dead':'')+(S.target===p.id?' target':'');let shown=p.shown;let names=shown?p.gs.map(g=>g.name).join(' / '):'??? / ???';d.innerHTML='<div class="name">Người chơi '+(p.id+1)+(p.ai?' 🤖':' 👤')+'</div><div>'+esc(names)+'</div><div class="tag">'+(shown?p.gs[0].f:'Chưa xác định')+'</div><div class="hp"><i style="width:'+Math.max(0,p.hp/p.max*100)+'%"></i></div><div>'+p.hp+'/'+p.max+' HP · '+p.hand.length+' bài</div>'+(p.alive&&p.id!==0?'<button style="margin-top:8px" data-target="'+p.id+'">Chọn mục tiêu</button>':'');box.appendChild(d)});box.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{S.target=+b.dataset.target;$('targetText').textContent='Người chơi '+(S.target+1);render()});let h=$('hand');h.innerHTML='';S.players[0].hand.forEach((c,i)=>{let b=document.createElement('button');b.className='card';b.innerHTML='<b>'+esc(c)+'</b><small>'+cardHelp(c)+'</small>';b.onclick=()=>useCard(S.players[0],i);h.appendChild(b)});$('end').disabled=S.turn!==0||!!S.winner;$('draw').disabled=S.turn!==0||!!S.winner;$('reveal').disabled=S.turn!==0||!!S.winner}
function cardHelp(c){return ({Slash:'1 dmg', 'Fire Slash':'2 dmg','Thunder Slash':'2 dmg',Dodge:'Né',Peach:'Hồi máu',Wine:'Tăng sát thương',Dismantlement:'Bỏ 1 bài',Snatch:'Cướp 1 bài',Duel:'2 dmg', 'Fire Attack':'1 dmg', 'Ex Nihilo':'Rút 2',Harvest:'Mọi người +1', 'Alliance Feast':'Mọi người hồi','Savage Assault':'Đánh mọi mục tiêu','Archery Attack':'Đánh mọi mục tiêu',Weapon:'Trang bị',Armor:'Trang bị','Horse +1':'Khoảng cách','Horse -1':'Khoảng cách'}[c]||'Hiệu ứng'))}
document.querySelectorAll('.general-btn').forEach(b=>b.addEventListener('click',()=>pickGeneral(+b.dataset.i,b)));$('start').onclick=start;$('draw').onclick=()=>{draw(S.players[0],1);log('Bạn rút 1 lá.');render()};$('end').onclick=()=>{if(S.turn===0){next()}};$('reveal').onclick=()=>{reveal(S.players[0],1);render()};$('restart').onclick=()=>{location.reload()};
</script>
<script>
(function(){
  const buttons=[...document.querySelectorAll('.general-btn')];
  const counter=document.getElementById('pickCount');
  function update(){const n=document.querySelectorAll('.general-btn.picked').length;if(counter)counter.textContent='Đã chọn: '+n+'/2';}
  buttons.forEach(function(b){
    b.addEventListener('click',function(){
      if(b.classList.contains('picked')) b.classList.remove('picked');
      else {
        if(document.querySelectorAll('.general-btn.picked').length>=2){alert('Chỉ được chọn 2 tướng.');return;}
        b.classList.add('picked');
      }
      update();
    });
  });
  const startButton=document.getElementById('start');
  if(startButton) startButton.addEventListener('click',function(){
    if(document.querySelectorAll('.general-btn.picked').length!==2){alert('Hãy bấm chọn đủ 2 tướng trước!');return;}
    if(typeof window.start==='function') window.start();
  });
  update();
})();
</script>

<script>
window.toggleGeneral = function(button) {
  var selected = document.querySelectorAll('#generalPick .general-btn.picked');
  if (button.classList.contains('picked')) {
    button.classList.remove('picked');
  } else {
    if (selected.length >= 2) {
      alert('Bạn chỉ được chọn 2 tướng. Bấm vào tướng đã chọn để bỏ chọn.');
      return;
    }
    button.classList.add('picked');
  }
  var count = document.querySelectorAll('#generalPick .general-btn.picked').length;
  document.getElementById('pickCount').textContent = 'Đã chọn: ' + count + '/2';
};
</script>
</body></html>
